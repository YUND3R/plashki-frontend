<!--
  Шаблон HTML-письма Plashki (регистрация / сброс пароля и др.).
  Бэкенд подставляет значения вместо плейсхолдеров вида {{token}}.

  Плейсхолдеры:
  {{preheader}}          - прехедер (скрытый превью-текст в клиентах)
  {{logo_url}}           - абсолютный URL логотипа (картинка)
  {{guard_icon_url}}     - иконка «щит» у строки срока действия ссылки
  {{warning_icon_url}}   - иконка предупреждения (только если подставили блок сброса пароля)
  {{site_url}}           - URL сайта (для ссылки с логотипа)
  {{user_name}}          - имя пользователя
  {{greeting_prefix}}    - например «Добро пожаловать» / «Привет»
  {{header_emoji}}       - эмодзи в шапке
  {{heading}}            - заголовок письма
  {{body}}               - основной текст (можно HTML при необходимости - осторожнее с XSS)
  {{cta_url}}            - ссылка синей кнопки
  {{cta_label}}          - текст синей кнопки
  {{expiry_line}}        - строка про срок действия ссылки
  {{warning_row_html}}   - дополнительная строка <tr>…</tr> или пустая строка для регистрации
  {{footer_message}}     - текст в футере
  {{footer_emoji}}       - эмодзи в футере

  Для письма «сброс пароля» подставьте в {{warning_row_html}} блок из секции
  SNIPPET_WARNING_ROW ниже (целиком, без обёртки комментария).
-->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      background: #ffffff;
    }
    a {
      color: #2f6feb;
    }
  </style>
</head>
<body>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background:#ffffff;">
  <tr>
    <td align="center" style="padding:32px 20px 48px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
      <span style="display:none!important;visibility:hidden;mso-hide:all;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{preheader}}</span>
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:560px;margin:0 auto;">
        <tr>
          <td style="padding:0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td valign="middle" style="vertical-align:middle;">
                  <a href="{{site_url}}" style="text-decoration:none;line-height:0;display:inline-block;">
                    <img src="{{logo_url}}" alt="Plashki" width="118" height="26" style="display:block;border:0;outline:none;text-decoration:none;height:auto;max-width:118px;width:118px;font-size:0;line-height:0;" />
                  </a>
                </td>
                <td valign="middle" align="right" style="vertical-align:middle;text-align:right;white-space:nowrap;">
                  <table role="presentation" cellpadding="0" cellspacing="0" align="right" style="margin:0;">
                    <tr>
                      <td valign="middle" style="vertical-align:middle;padding-right:10px;font-size:17px;font-weight:300;color:#000000;line-height:1.35;">
                        {{greeting_prefix}}, {{user_name}}!
                      </td>
                      <td valign="middle" style="vertical-align:middle;">
                        <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="width:40px;height:40px;background:#E8F0FE;border-radius:10px;text-align:center;vertical-align:middle;font-size:20px;line-height:40px;mso-line-height-rule:exactly;padding:0;">{{header_emoji}}</td></tr></table>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 0 20px;">
            <div style="height:1px;background:#E8EAED;line-height:1px;font-size:1px;">&nbsp;</div>
          </td>
        </tr>
        <tr>
          <td style="padding:0 0 12px;font-size:22px;font-weight:600;color:#000000;line-height:1.25;letter-spacing:-0.02em;">
            {{heading}}
          </td>
        </tr>
        <tr>
          <td style="padding:0 0 28px;font-size:20px;font-weight:300;line-height:1.6;color:#4D4D4D;">
            {{body}}
          </td>
        </tr>
        <tr>
          <td style="padding:0 0 24px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;">
              <tr>
                <td align="center" valign="middle" height="75" style="height:75px;border-radius:12px;background-color:#2f6feb;vertical-align:middle;padding:0;">
                  <a href="{{cta_url}}" style="display:block;height:75px;box-sizing:border-box;line-height:75px;padding:0 20px;font-size:20px;font-weight:500;color:#ffffff!important;text-decoration:none;border-radius:12px;text-align:center;">{{cta_label}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:0 0 8px;">
            <table role="presentation" cellpadding="0" cellspacing="0"><tr>
              <td valign="middle" style="vertical-align:middle;padding:0 10px 0 0;line-height:0;">
                <img src="{{guard_icon_url}}" alt="" width="20" height="20" style="display:block;border:0;outline:none;width:20px;height:20px;" />
              </td>
              <td valign="middle" style="vertical-align:middle;font-size:17px;font-weight:400;line-height:1.5;color:#54637E;">{{expiry_line}}</td>
            </tr></table>
          </td>
        </tr>
        {{warning_row_html}}
        <tr>
          <td style="padding:32px 0 20px;">
            <div style="height:1px;background:#E8EAED;line-height:1px;font-size:1px;">&nbsp;</div>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0;text-align:center;">
            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto;"><tr>
              <td style="font-size:17px;font-weight:300;color:#000000;line-height:1.45;padding-right:10px;vertical-align:middle;">{{footer_message}}</td>
              <td style="vertical-align:middle;">
                <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="width:40px;height:40px;background:#E8F0FE;border-radius:10px;text-align:center;vertical-align:middle;font-size:20px;line-height:40px;mso-line-height-rule:exactly;padding:0;">{{footer_emoji}}</td></tr></table>
              </td>
            </tr></table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<!--
  ========== SNIPPET_WARNING_ROW ==========
  Вставить в {{warning_row_html}} для письма «сброс пароля» (для регистрации - пустая строка):

<tr>
  <td style="padding:8px 0 0;">
    <table role="presentation" cellpadding="0" cellspacing="0"><tr>
      <td valign="top" style="vertical-align:top;padding:5px 10px 0 0;line-height:0;">
        <img src="{{warning_icon_url}}" alt="" width="20" height="20" style="display:block;border:0;outline:none;width:20px;height:20px;" />
      </td>
      <td valign="top" style="vertical-align:top;font-size:17px;font-weight:400;line-height:1.3;color:#54637E;">Если ты не запрашивал смену пароля, проигнорируй и удали это сообщение из почты.</td>
    </tr></table>
  </td>
</tr>
-->
</body>
</html>

name: Frontend Prod CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/nginx.conf"
      - "deploy/vps-nginx.conf"
      - "docker-compose.prod.yml"
      - ".github/workflows/frontend-prod-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after build"
        required: true
        default: true
        type: boolean

concurrency:
  group: frontend-prod-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: plashki-frontend

jobs:
  quality:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        env:
          VITE_API_BASE_URL: ${{ secrets.FRONTEND_API_BASE_URL }}
        run: npm run build

  build-and-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.export.outputs.image_tag }}
      image_repo: ${{ steps.export.outputs.image_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve lowercase image namespace
        id: vars
        run: |
          echo "image_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plashki-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VITE_API_BASE_URL=${{ secrets.FRONTEND_API_BASE_URL }}
            SOURCE_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image_repo }}:sha-${{ github.sha }}
            ${{ steps.vars.outputs.image_repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export deploy data
        id: export
        run: |
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_repo=${{ steps.vars.outputs.image_repo }}" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure remote app directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: mkdir -p "${{ secrets.PROD_APP_DIR }}/deploy"

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: docker-compose.prod.yml
          target: ${{ secrets.PROD_APP_DIR }}
          strip_components: 0

      - name: Upload public nginx configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: deploy/vps-nginx.conf
          target: ${{ secrets.PROD_APP_DIR }}/deploy
          strip_components: 1

      - name: Deploy stack on remote host
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REPO: ${{ needs.build-and-push.outputs.image_repo }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          envs: PROD_ENV_FILE,PROD_APP_DIR,GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG,IMAGE_REPO
          script: |
            set -euo pipefail
            cd "$PROD_APP_DIR"
            if [ -n "${PROD_ENV_FILE:-}" ]; then
              printf '%s\n' "$PROD_ENV_FILE" > .env
            fi
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export IMAGE_TAG="$IMAGE_TAG"
            export IMAGE_REPO="$IMAGE_REPO"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            install -m 644 "$PROD_APP_DIR/deploy/vps-nginx.conf" /etc/nginx/sites-available/default
            nginx -t
            systemctl reload nginx
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
